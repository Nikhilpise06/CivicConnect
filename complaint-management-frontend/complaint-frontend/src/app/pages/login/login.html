<div class="container">

    <h2>User Login</h2>

    <form (ngSubmit)="loginUser()">

        <input
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="Enter Email"
            required>

        <input
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Enter Password"
            required>

        <button type="submit">
            Login
        </button>

    </form>

    <p>{{ message }}</p>

</div>
