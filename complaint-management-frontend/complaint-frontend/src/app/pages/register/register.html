<div class="container">

    <h2>User Registration</h2>

    <form (ngSubmit)="registerUser()">

        <input
            type="text"
            name="name"
            [(ngModel)]="user.name"
            placeholder="Enter Name"
            required>

        <input
            type="email"
            name="email"
            [(ngModel)]="user.email"
            placeholder="Enter Email"
            required>

        <input
            type="password"
            name="password"
            [(ngModel)]="user.password"
            placeholder="Enter Password"
            minlength="8"
            required>

        <button type="submit">
            Register
        </button>

    </form>

    <p>{{ message }}</p>

</div>
