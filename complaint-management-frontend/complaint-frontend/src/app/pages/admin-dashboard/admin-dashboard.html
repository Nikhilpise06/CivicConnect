<div class="container">

    <h2>Admin Dashboard</h2>

    <p>Total Complaints: {{ complaints.length }}</p>

    <table>

        <tr>

            <th>ID</th>

            <th>Title</th>

            <th>Description</th>

            <th>Location</th>

            <th>Status</th>

            <th>Update Status</th>

        </tr>

        <tr *ngFor="let c of complaints">

            <td>{{ c.id }}</td>

            <td>{{ c.title }}</td>

            <td>{{ c.description }}</td>

            <td>{{ c.location }}</td>

            <td>{{ c.status }}</td>

            <td>

                <select
                    [ngModel]="c.status"
                    (ngModelChange)="updateStatus(c.id, $event)"
                    [name]="'status' + c.id">

                    <option value="PENDING">Pending</option>

                    <option value="IN_PROGRESS">In Progress</option>

                    <option value="RESOLVED">Resolved</option>

                </select>

            </td>

        </tr>

    </table>

    <p>{{ message }}</p>

</div>
