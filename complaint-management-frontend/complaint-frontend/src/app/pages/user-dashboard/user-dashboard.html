<div class="container">

    <h2>User Dashboard</h2>

    <h3>Submit Complaint</h3>

    <form (ngSubmit)="submitComplaint()">

        <input
            type="text"
            name="title"
            [(ngModel)]="complaint.title"
            placeholder="Complaint Title"
            required>

        <input
            type="text"
            name="category"
            [(ngModel)]="complaint.category"
            placeholder="Category">

        <input
            type="text"
            name="location"
            [(ngModel)]="complaint.location"
            placeholder="Location">

        <textarea
            name="description"
            [(ngModel)]="complaint.description"
            placeholder="Complaint Description"
            required>
        </textarea>

        <button type="submit">
            Submit Complaint
        </button>

    </form>

    <p>{{ message }}</p>

    <h3>My Complaints</h3>

    <table>

        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Status</th>
        </tr>

        <tr *ngFor="let c of complaints">

            <td>{{ c.id }}</td>

            <td>{{ c.title }}</td>

            <td>{{ c.status }}</td>

        </tr>

    </table>

</div>
